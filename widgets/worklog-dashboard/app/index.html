<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工数ダッシュボード</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>工数ダッシュボード</h1>
      <div class="controls">
        <div class="seg" id="presets" role="group" aria-label="期間">
          <button type="button" data-preset="thisMonth">今月</button>
          <button type="button" data-preset="lastMonth">先月</button>
          <button type="button" data-preset="last3Months">直近3か月</button>
          <button type="button" data-preset="fiscalYear">今年度</button>
        </div>
        <span class="dates">
          <input type="date" id="from" aria-label="開始日">
          <span>〜</span>
          <input type="date" id="to" aria-label="終了日">
        </span>
        <button type="button" class="btn" id="reload">更新</button>
        <span class="status" id="status" aria-live="polite"></span>
      </div>
    </div>

    <div class="filters" role="group" aria-label="絞り込み">
      <span class="filters-label">絞り込み</span>
      <div id="ms-project"></div>
      <div id="ms-process"></div>
      <button type="button" class="btn" id="reset-filters">リセット</button>
      <div class="chips" id="chips"></div>
    </div>

    <div id="notice"></div>

    <div id="main">
      <div class="kpis" id="kpis"></div>

      <div class="tabs" role="tablist" aria-label="分析">
        <button type="button" role="tab" data-tab="overview" id="tab-overview">概要・推移</button>
        <button type="button" role="tab" data-tab="input" id="tab-input">入力状況</button>
        <button type="button" role="tab" data-tab="cross" id="tab-cross">クロス分析</button>
        <button type="button" role="tab" data-tab="share" id="tab-share">案件以外の割合</button>
      </div>

      <!-- 概要・推移 -->
      <div class="grid" role="tabpanel" id="panel-overview" aria-labelledby="tab-overview">
        <section class="card wide" id="card-period">
          <div class="card-head">
            <h2>期間別工数<span class="sub" id="sub-period"></span></h2>
            <div class="card-tools">
              <label class="pick">色分け
                <select id="stack-by">
                  <option value="">なし</option>
                  <option value="category">区分</option>
                  <option value="project">PJ名</option>
                  <option value="staff">作業担当者</option>
                  <option value="process">工程</option>
                </select>
              </label>
              <div class="seg" id="units" role="group" aria-label="単位">
                <button type="button" data-unit="day">日</button>
                <button type="button" data-unit="week">週</button>
                <button type="button" data-unit="month">月</button>
              </div>
              <div class="seg" data-view-for="period" role="group" aria-label="表示">
                <button type="button" data-view="chart">グラフ</button>
                <button type="button" data-view="table">表</button>
              </div>
            </div>
          </div>
          <div class="card-body" id="body-period"></div>
        </section>

        <section class="card" id="card-staff">
          <div class="card-head">
            <h2>作業担当者別工数<span class="sub" id="sub-staff"></span></h2>
            <div class="seg" data-view-for="staff" role="group" aria-label="表示">
              <button type="button" data-view="chart">グラフ</button>
              <button type="button" data-view="table">表</button>
            </div>
          </div>
          <div class="card-body" id="body-staff"></div>
        </section>

        <section class="card" id="card-process">
          <div class="card-head">
            <h2>工程別工数<span class="sub" id="sub-process"></span></h2>
            <div class="seg" data-view-for="process" role="group" aria-label="表示">
              <button type="button" data-view="chart">グラフ</button>
              <button type="button" data-view="table">表</button>
            </div>
          </div>
          <div class="card-body" id="body-process"></div>
        </section>

        <section class="card wide" id="card-project">
          <div class="card-head">
            <h2>PJ名別工数<span class="sub" id="sub-project"></span></h2>
            <div class="seg" data-view-for="project" role="group" aria-label="表示">
              <button type="button" data-view="chart">グラフ</button>
              <button type="button" data-view="table">表</button>
            </div>
          </div>
          <div class="card-body" id="body-project"></div>
        </section>
        <p class="hint wide">棒をクリックすると、その担当者・工程・PJ を絞り込みに加えます（もう一度クリックで外す）。PJ名・工程は上の「絞り込み」から複数選べます。前期間＝直前の同じ日数。</p>
      </div>

      <!-- ① 入力状況 -->
      <div class="grid" role="tabpanel" id="panel-input" aria-labelledby="tab-input" hidden>
        <section class="card wide">
          <div class="card-head">
            <h2>入力状況（作業担当者×日）<span class="sub" id="sub-input"></span></h2>
          </div>
          <p class="note" id="note-input"></p>
          <div id="legend-input"></div>
          <div class="card-body scroll-x" id="body-input"></div>
        </section>
      </div>

      <!-- ④ クロス分析 -->
      <div class="grid" role="tabpanel" id="panel-cross" aria-labelledby="tab-cross" hidden>
        <section class="card wide">
          <div class="card-head">
            <h2>クロス分析<span class="sub" id="sub-cross"></span></h2>
            <div class="card-tools">
              <div class="seg" id="cross-kind" role="group" aria-label="組み合わせ">
                <button type="button" data-cross="project:process">PJ名×工程</button>
                <button type="button" data-cross="staff:project">担当者×PJ名</button>
                <button type="button" data-cross="staff:process">担当者×工程</button>
              </div>
              <div class="seg" id="cross-mode" role="group" aria-label="値">
                <button type="button" data-mode="hours">工数</button>
                <button type="button" data-mode="rowpct">行の中の割合</button>
              </div>
            </div>
          </div>
          <p class="note">色が濃いほど工数が多い。「行の中の割合」にすると、行ごとの配分（例：PJ ごとの工程の割合）を比べられます。</p>
          <div class="card-body scroll-x" id="body-cross"></div>
        </section>
      </div>

      <!-- ⑤ 案件以外の割合 -->
      <div class="grid" role="tabpanel" id="panel-share" aria-labelledby="tab-share" hidden>
        <section class="card wide">
          <div class="card-head">
            <h2>区分の割合（作業担当者別）<span class="sub" id="sub-share"></span></h2>
          </div>
          <p class="note" id="note-share"></p>
          <div id="legend-share"></div>
          <div class="card-body" id="body-share"></div>
        </section>
        <section class="card wide">
          <div class="card-head">
            <h2>区分の推移<span class="sub" id="sub-share-trend"></span></h2>
          </div>
          <div class="card-body" id="body-share-trend"></div>
        </section>
      </div>
    </div>
  </div>
  <div class="tip" id="tip" role="tooltip"></div>

  <!-- Zoho CRM ウィジェット JS SDK：同梱したもの → 無ければ sdk-loader.js が正しい URL から読む -->
  <script src="ZohoEmbededAppSDK.min.js"></script>
  <script src="sdk-loader.js"></script>
  <script src="config.js"></script>
  <script src="aggregate.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
